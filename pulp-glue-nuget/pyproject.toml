[build-system]
requires = ["setuptools>=67"]
build-backend = "setuptools.build_meta"

[project]
name = "pulp-glue-nuget"
version = "0.1.0.dev"
description = "Version agnostic library to talk to the pulp_nuget API (used by pulp-cli-nuget)."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-2.0-or-later"
authors = [{ name = "Phillip DiCarlo", email = "sasha-1221@hotmail.com" }]
dependencies = ["pulp-glue>=0.34.0,<0.42"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.urls]
repository = "https://github.com/PhillipDiCarlo/pulp-cli-nuget"

[tool.setuptools.packages.find]
include = ["pulp_glue.nuget"]

[tool.setuptools.package-data]
"pulp_glue.nuget" = ["py.typed"]
