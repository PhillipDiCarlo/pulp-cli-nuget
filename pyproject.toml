[build-system]
requires = ["setuptools>=67"]
build-backend = "setuptools.build_meta"

[project]
name = "pulp-cli-nuget"
version = "0.1.0.dev"
description = "Command line interface to talk to pulp_nuget (NuGet plugin for Pulp 3)."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-2.0-or-later"
authors = [{ name = "Phillip DiCarlo", email = "sasha-1221@hotmail.com" }]
dependencies = [
  "pulp-cli>=0.34.0,<0.42",
  "pulp-glue-nuget==0.1.0.dev",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.urls]
repository = "https://github.com/PhillipDiCarlo/pulp-cli-nuget"

[project.entry-points."pulp_cli.plugins"]
nuget = "pulpcore.cli.nuget"

[tool.setuptools.packages.find]
include = ["pulpcore.cli.nuget"]

[tool.setuptools.package-data]
"pulpcore.cli.nuget" = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
